[bar/main]
background=#000000
border-bottom-size=1
border-color=#434852
border-left-size=1
border-right-size=1
border-top-size=1
enable-ipc=true
fixed-center=false
font-0=Fira Code Nerd Font:pixelsize=16;3
font-1=Fira Code Nerd Font:weight=Bold:pixelsize=18;3
font-2=Fira Code Nerd Font:style=Light:pixelsize=18;2
foreground=#abb2bf
height=35
line-color=#ef596f
line-size=3
modules-center=xwindow
modules-left=i3 separator
modules-right=separator volume separator battery separator vpn vpn-separator wifi wifi-separator ethernet ethernet-separator time separator memory separator cpu separator date
offset-x=10
offset-y=10
override-redirect=false
padding-left=1
padding-right=1
width=100%
wm-restack=i3

[module/battery]
adapter=ADP1
animation-charging-0=󰁺
animation-charging-1=󰁻
animation-charging-2=󰁼
animation-charging-3=󰁽
animation-charging-4=󰁾
animation-charging-5=󰁿
animation-charging-6=󰂀
animation-charging-7=󰂁
animation-charging-8=󰂂
animation-charging-9=󰁹
animation-charging-framerate=750
battery=BAT0
format-charging=%{T2}%{F#434852}<animation-charging>%{F-}%{T-} <label-charging>
format-discharging=%{T2}%{F#434852}<ramp-capacity>%{F-}%{T-} <label-discharging>
format-full-prefix="󰁹 "
label-charging=%percentage:3%%
label-discharging=%percentage:3%%
low-at=0
ramp-capacity-0=󰁺
ramp-capacity-1=󰁻
ramp-capacity-2=󰁼
ramp-capacity-3=󰁽
ramp-capacity-4=󰁾
ramp-capacity-5=󰁿
ramp-capacity-6=󰂀
ramp-capacity-7=󰂁
ramp-capacity-8=󰂂
ramp-capacity-9=󰁹
type=internal/battery

[module/cpu]
format-prefix=%{T2}%{F#434852} %{F-}%{T-}
interval=2
label=%percentage:3%%
type=internal/cpu

[module/date]
date=%d/%m/%Y
format-prefix=%{T2}%{F#434852} %{F-}%{T-}
interval=60
label=%date%
type=internal/date

[module/ethernet]
format-connected=%{T2}%{F#434852}%{F-}%{T-} <label-connected>
format-disconnected=
interface=enp3s0
interface-type=wired
label-connected=%netspeed:8%
label-disconnected=
type=internal/network

[module/ethernet-separator]
format-connected=" %{F#434852}%{T3}│%{T-}%{F-} "
format-disconnected=
interface=enp3s0
interface-type=wired
label-connected=
label-disconnected=
type=internal/network

[module/i3]
index-sort=true
label-empty=%index%
label-empty-foreground=#434852
label-empty-padding=1
label-focused=%index%
label-focused-padding=1
label-focused-underline=#61afef
label-occupied=%index%
label-occupied-padding=1
label-unfocused=%index%
label-unfocused-padding=1
label-urgent=%index%
label-urgent-padding=1
label-urgent-underline=#ef596f
pin-workspaces=true
show-all=true
type=internal/i3

[module/memory]
format-prefix="%{T2}%{F#434852} %{F-}%{T-} "
interval=2
label=%gb_used:9%
type=internal/memory

[module/separator]
label=" %{F#434852}%{T3}│%{T-}%{F-} "
type=custom/text

[module/time]
format-prefix=%{T2}%{F#434852} %{F-}%{T-}
interval=30
label=%time%
time=%I:%M %p
type=internal/date

[module/volume]
format-volume=%{T2}%{F#434852}<ramp-volume>%{F-}%{T-} <label-volume>
interval=5
label-muted="%{T2}%{F#434852} %{F-}%{T-}     "
label-volume=%percentage:3%%
ramp-volume-0=" "
ramp-volume-1=" "
ramp-volume-2=" "
type=internal/pulseaudio

[module/vpn]
exec=echo VPN
exec-if=/nix/store/v8llyqw71lygr2llhmcc8ya5bdlzq45v-bash-5.3p9/bin/bash -c '/nix/store/54bkb4namzpkky4d2w4zyyqs0nkjj9k4-iproute2-7.1.0/bin/ip a | /nix/store/p48bl1kiw42fakak404srawmlr730b7j-gnugrep-3.12/bin/grep -q tun0'
format=%{T2}%{F#434852} %{F-}%{T-} <label>
interval=5
label=%output%
type=custom/script

[module/vpn-separator]
exec=echo VPN
exec-if=/nix/store/v8llyqw71lygr2llhmcc8ya5bdlzq45v-bash-5.3p9/bin/bash -c '/nix/store/54bkb4namzpkky4d2w4zyyqs0nkjj9k4-iproute2-7.1.0/bin/ip a | /nix/store/p48bl1kiw42fakak404srawmlr730b7j-gnugrep-3.12/bin/grep -q tun0'
format=" %{F#434852}%{T3}│%{T-}%{F-} "
interval=5
label=%output%
type=custom/script

[module/wifi]
format-connected=%{T2}%{F#434852}<ramp-signal>%{F-}%{T-} <label-connected>
format-disconnected=
interface=wlan0
interface-type=wireless
label-connected=%netspeed:8%
label-disconnected=
ramp-signal-0=󰢼
ramp-signal-1=󰢼
ramp-signal-2=󰢽
ramp-signal-3=󰢽
ramp-signal-4=󰢾
ramp-signal-5=󰢾
type=internal/network

[module/wifi-separator]
format-connected=" %{F#434852}%{T3}│%{T-}%{F-} "
format-disconnected=
interface=wlan0
interface-type=wireless
label-connected=
label-disconnected=
type=internal/network

[module/xwindow]
label=%title:0:20:...%
type=internal/xwindow

[settings]
screenchange-reload=true
