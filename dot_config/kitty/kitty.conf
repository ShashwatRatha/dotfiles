shell /usr/bin/zsh

# Enable Kitty socket listening & remote control
allow_remote_control socket-only
listen_on unix:@mykitty
font_family Fira Code Nerd Font
font_size 16

# --- Moonfly Dark ---
background            #080808
foreground             #bdbdbd
cursor                 #9e9e9e
cursor_text_color      #080808
selection_background   #b2ceee
selection_foreground   #080808

color0  #323437
color1  #ff5d5d
color2  #8cc85f
color3  #e3c78a
color4  #80a0ff
color5  #cf87e8
color6  #79dac8
color7  #c6c6c6
color8  #949494
color9  #ff5189
color10 #36c692
color11 #c6c684
color12 #74b2ff
color13 #ae81ff
color14 #85dc85
color15 #e4e4e4
# Open fzf-fm in a floating overlay window over Kitty
map ctrl+alt+f launch --type=overlay --cwd=current fzf-fm
